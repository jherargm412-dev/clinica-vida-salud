# Sitio de Apache para Laravel: la carpeta pública es public/ (ahí está index.php).
# El puerto 8080 lo cambia docker/entrypoint.sh por el valor de la variable PORT.
<VirtualHost *:8080>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        # Permite que public/.htaccess envíe todas las rutas a index.php
        AllowOverride All
        Require all granted
    </Directory>

    # Los registros de Apache van a la consola (se ven en los logs de Railway / docker compose)
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
